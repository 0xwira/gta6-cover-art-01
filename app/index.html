<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <title>Afterglow Studio</title>
</head>
<body>
  <header class="mast"><strong><i></i> AFTERGLOW</strong><span>POSTER STUDIO <b>01</b></span></header>
  <main>
    <aside aria-label="Cover settings">
      <section><h2><span>01</span> Photos</h2>
        <label class="upload">＋ Add photos<input id="photos" type="file" accept="image/*" multiple></label>
        <div id="photo-list"></div>
      </section>
      <section><h2><span>02</span> Frames</h2>
        <div class="choices" id="layouts" aria-label="Layout">
          <button data-layout="triptych">Triptych</button><button data-layout="mosaic">Mosaic</button><button data-layout="five">Five frame</button>
        </div>
        <div class="pair"><label>Frame<select id="panel"></select></label><label>Photo<select id="panel-photo"></select></label></div>
        <label class="range">Position X<input id="crop-x" type="range" min="-1" max="1" step=".01"><output></output></label>
        <label class="range">Position Y<input id="crop-y" type="range" min="-1" max="1" step=".01"><output></output></label>
        <label class="range">Zoom<input id="zoom" type="range" min="1" max="3" step=".01"><output></output></label>
      </section>
      <section><h2><span>03</span> Lettering</h2>
        <label class="field">Title<input id="title" maxlength="60"></label>
        <label class="field">Caption<input id="subtitle" maxlength="80"></label>
      </section>
      <section><h2><span>04</span> Finish</h2>
        <label class="range">Sunset grade<input id="grade" type="range" min="0" max="100"><output></output></label>
        <label class="range">Film grain<input id="grain" type="range" min="0" max="100"><output></output></label>
        <label class="range">Vignette<input id="vignette" type="range" min="0" max="100"><output></output></label>
      </section>
    </aside>
    <article aria-label="Preview and export">
      <div class="preview-label"><span>LIVE PREVIEW</span><span id="dimensions"></span></div>
      <div class="stage"><canvas id="cover" aria-label="Current cover"></canvas></div>
      <div class="toolbar">
        <div class="choices" id="sizes" aria-label="Export format">
          <button data-size="square" aria-label="Square">1:1</button><button data-size="portrait" aria-label="Portrait">4:5</button><button data-size="landscape" aria-label="Landscape">16:9</button>
        </div>
        <button id="export">↓ &nbsp; Export PNG</button>
      </div>
      <p id="status" role="status"></p>
    </article>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
